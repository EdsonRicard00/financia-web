<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusivité | Elegância em Vidro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1 class="logo">Exclusivité</h1>
        </header>

        <section class="product-info">
            <span class="badge">Lançamento</span>
            <h2>O Padrão Ouro da Tecnologia</h2>
            <p>Design minimalista, performance máxima. Feito para quem não aceita menos que a excelência no seu dia a dia.</p>
            
            <div class="price-container">
                <span class="price">R$ 1.299,00</span>
                <span class="installments">ou 12x de R$ 108,25</span>
            </div>

            <button id="btn-comprar" class="btn-comprar">Comprar Agora</button>
            <p id="status-message" class="hidden-message"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
